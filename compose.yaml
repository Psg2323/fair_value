services:
  kafka:
    image: apache/kafka:4.0.2
    hostname: kafka
    container_name: fair-value-course-kafka
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:29092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  spark:
    image: apache/spark:4.0.4-scala2.13-java17-python3-ubuntu
    profiles: ["course"]
    depends_on:
      kafka:
        condition: service_healthy
    user: "185:1000"
    working_dir: /opt/fair_value
    volumes:
      - .:/opt/fair_value
    command: ["sleep", "infinity"]

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fair-value-airflow:3.3.1-python3.12
    profiles: ["orchestration"]
    container_name: fair-value-airflow
    restart: unless-stopped
    user: "${AIRFLOW_UID:-1000}:0"
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/fair_value/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      FAIR_VALUE_DATA_DIR: /opt/fair_value/data
      PYTHONPATH: /opt/fair_value/src
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/opt/fair_value
      - airflow_home:/opt/airflow
    command: standalone
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  airflow_home:
